<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b0c" />
  <meta name="description" content="Атлас теней. Послание для участников Охоты по Нячангу × PROSTRANSTVO." />
  <title>Атлас теней — Охота × PROSTRANSTVO</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #090b0c;
      --paper: #c7b99b;
      --gold: #c1a77b;
      --gold-light: #e8d9b6;
      --muted: #8f8c83;
      --book-w: clamp(200px, 25vw, 295px);
      --book-h: calc(var(--book-w) * 1.34);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--ink); }
    body {
      margin: 0;
      min-width: 300px;
      min-height: 100svh;
      overflow-x: hidden;
      background: var(--ink);
      color: #e9e3d5;
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 8px; }
    .scene {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 46% 37% at 50% 55%, rgba(105,82,56,.20), transparent 90%),
        radial-gradient(ellipse 62% 75% at 50% 60%, rgba(37,43,42,.46), transparent 83%),
        linear-gradient(130deg, #07090a 5%, #101313 45%, #060808 95%);
    }
    .scene::before {
      content: '';
      position: absolute;
      z-index: -1;
      pointer-events: none;
      width: min(950px, 125vw);
      aspect-ratio: 1;
      left: 50%; top: 54%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(187,164,119,.07);
      border-radius: 50%;
      box-shadow: 0 0 0 75px rgba(196,160,104,.015), 0 0 0 230px rgba(196,160,104,.011), inset 0 0 110px rgba(173,126,75,.035);
    }
    .scene::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      opacity: .19;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }
    .dust { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .speck {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: #cbb991;
      opacity: var(--o);
      box-shadow: 0 0 8px 1px rgba(225,184,116,.27);
      animation: drift var(--t) ease-in-out infinite alternate;
      animation-delay: var(--d);
    }
    @keyframes drift { to { transform: translate3d(var(--x), -25px, 0); opacity: .05; } }
    .topbar {
      position: relative; z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: clamp(23px, 4vh, 45px) clamp(24px, 5vw, 76px);
      color: #b7aa92;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .24em;
    }
    .topbar .mark { color: #e3d2b2; white-space: nowrap; }
    .topbar .serial { opacity: .58; text-align: right; font-weight: 400; }
    .topbar .cross { color: #ab8154; margin-right: 9px; font-size: 14px; }
    .content {
      position: relative;
      z-index: 4;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0 22px 27px;
      text-align: center;
    }
    .chapter {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .36em;
      text-transform: uppercase;
      text-shadow: 0 0 13px rgba(164,119,58,.25);
      transition: opacity .7s;
    }
    h1 {
      min-height: 2.3em;
      margin: 16px 0 0;
      font-size: clamp(24px, 3.25vw, 42px);
      line-height: 1.17;
      font-weight: 400;
      letter-spacing: .01em;
      color: #ede5d2;
      text-wrap: balance;
      transition: opacity .55s, transform .8s;
    }
    .artifact {
      width: min(100%, 850px);
      height: clamp(330px, 49vh, 525px);
      position: relative;
      margin: 1px auto 0;
      perspective: 1600px;
      perspective-origin: 50% 50%;
    }
    .artifact::before {
      content: '';
      position: absolute;
      left: 50%; top: 49%;
      width: min(540px, 98vw); aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(171,127,77,.15) 0, rgba(132,91,51,.055) 42%, transparent 70%);
      transform: translate(-50%, -50%);
      filter: blur(20px);
      opacity: .66;
      transition: opacity .9s, transform 1.5s;
      pointer-events: none;
    }
    .artifact::after {
      content: '';
      position: absolute;
      bottom: 5%; left: 50%;
      width: min(480px, 92vw); height: 48px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(0,0,0,.79);
      filter: blur(24px);
      pointer-events: none;
      z-index: -1;
    }
    .book {
      position: absolute;
      width: var(--book-w);
      height: var(--book-h);
      top: 48%;
      left: calc(50% - var(--book-w) / 2);
      transform: translateY(-50%) rotate(-6deg);
      transform-style: preserve-3d;
      transition: transform 1.35s cubic-bezier(.19,.73,.16,1);
      filter: drop-shadow(14px 20px 14px rgba(0,0,0,.55));
    }
    .book::after {
      content: '';
      position: absolute;
      top: 3px; left: 5px;
      height: calc(100% - 7px); width: 11px;
      background: linear-gradient(90deg, #0b0e0f 15%, #6e573c 48%, #1d1a17 80%);
      box-shadow: -3px 0 6px rgba(0,0,0,.7);
      transform: translateZ(4px);
      pointer-events: none;
    }
    .right-page, .page-stack, .cover {
      position: absolute;
      inset: 0;
      border-radius: 2px 9px 9px 2px;
    }
    .page-stack {
      top: 4px; left: 3px; right: -5px; bottom: -4px;
      background: repeating-linear-gradient(0deg, #9d9075 0px, #d2c4a3 1px, #8d7b60 2px, #c8b99a 3px);
      box-shadow: 3px 4px 0 #29231d, 5px 8px 9px rgba(0,0,0,.7);
    }
    .right-page {
      overflow: hidden;
      background: radial-gradient(ellipse at 40% 45%, #d7c7a3, #ab9876 75%, #766045 115%);
      box-shadow: inset 0 0 32px rgba(56,37,23,.35), 0 0 0 1px #574831;
      z-index: 1;
    }
    .right-page::after, .inside::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(90deg, transparent 0 6px, rgba(61,37,21,.025) 7px 8px), radial-gradient(ellipse at 90% 10%, rgba(70,49,25,.22), transparent 40%);
      mix-blend-mode: multiply;
    }
    .page-top {
      position: absolute;
      width: 100%; top: 9%; left: 0;
      text-align: center;
      color: #5d4b37;
      font-size: clamp(8px, 1vw, 11px);
      letter-spacing: .17em;
    }
    .map-drawing { position: absolute; width: 86%; left: 7%; top: 18%; height: 63%; opacity: .75; }
    .page-bottom {
      position: absolute;
      bottom: 9%; width: 100%; left: 0;
      text-align: center; font-size: 10px; color: #64503a; letter-spacing: .24em;
    }
    .cover {
      z-index: 3;
      display: block;
      padding: 0;
      text-align: center;
      cursor: pointer;
      background: transparent;
      color: inherit;
      border: none;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.5s cubic-bezier(.2,.77,.12,1);
    }
    .face {
      position: absolute; inset: 0;
      overflow: hidden;
      border-radius: 3px 10px 10px 3px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .front {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8% 9% 10%;
      color: #d5bf91;
      background:
        linear-gradient(90deg, rgba(0,0,0,.85) 0, rgba(25,15,12,.65) 5%, transparent 17%),
        radial-gradient(ellipse at 57% 36%, rgba(101,78,55,.37), transparent 70%),
        linear-gradient(135deg, #25241e, #141713 40%, #28231d 100%);
      border: 1px solid #756347;
      box-shadow: inset 0 0 0 6px rgba(196,151,83,.095), inset 0 0 0 8px rgba(10,8,6,.8), inset -13px 0 15px rgba(0,0,0,.53), 4px 4px 4px rgba(0,0,0,.8);
    }
    .front::before {
      content: '';
      position: absolute;
      inset: 14px 14px 13px 19px;
      border: 1px solid rgba(190,155,99,.34);
      border-radius: 1px 6px 6px 1px;
      pointer-events: none;
    }
    .front::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.48' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      opacity: .3; mix-blend-mode: soft-light;
    }
    .cover-index { position: relative; font-family: Arial, sans-serif; font-size: 8px; letter-spacing: .36em; opacity: .72; }
    .cover-center { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; gap: 9px; }
    .sigil { width: 78%; max-width: 212px; height: auto; filter: drop-shadow(0 0 6px rgba(205,157,91,.12)); }
    .cover-title {
      margin: 2px 0 0;
      font-size: clamp(23px, 2.95vw, 34px);
      letter-spacing: .16em;
      line-height: 1.21;
      font-weight: 400;
      text-shadow: 0 1px 1px #000, 0 0 8px rgba(199,159,100,.18);
    }
    .cover-line { height: 1px; width: 46%; background: linear-gradient(90deg, transparent, rgba(213,181,127,.65), transparent); }
    .cover-bottom { position: relative; opacity: .65; font-size: 9px; letter-spacing: .27em; }
    .inside {
      transform: rotateY(180deg);
      background: radial-gradient(ellipse at 72% 43%, #d4c3a0, #b8a47f 72%, #847050 110%);
      border: 1px solid #756044;
      box-shadow: inset 0 0 45px rgba(43,30,20,.33);
      overflow: hidden;
    }
    .inside-art { position: absolute; inset: 12% 8%; width: 84%; height: 76%; opacity: .62; }
    .seam {
      position: absolute; top: 0; left: 0; width: 17px; height: 100%;
      background: linear-gradient(90deg, rgba(49,36,25,.78), rgba(62,42,24,.24) 49%, transparent);
      z-index: 2; pointer-events: none;
    }
    .word-stage {
      position: absolute;
      z-index: 7;
      left: 50%; top: 43%; width: 100%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      perspective: 600px;
    }
    .word {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: clamp(0px, 1.7vw, 19px);
      white-space: nowrap;
      font-size: clamp(75px, 13vw, 158px);
      line-height: 1.15;
      font-weight: 400;
      letter-spacing: -.045em;
      color: #f6ead5;
      text-shadow: 0 0 11px rgba(255,210,143,.75), 0 0 48px rgba(203,124,58,.6), 0 0 120px rgba(201,110,52,.32);
      filter: drop-shadow(0 5px 20px #130b08);
    }
    .word span {
      display: inline-block;
      opacity: 0;
      filter: blur(25px);
      transform: translateY(124px) translateX(var(--from)) scale(.18) rotate(-18deg);
    }
    .reveal-mist {
      position: absolute;
      width: min(550px, 90%); height: 165px;
      top: 60%; left: 50%;
      transform: translate(-50%, -50%) scale(.15);
      opacity: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(202,156,106,.35), rgba(119,97,78,.11) 39%, transparent 71%);
      filter: blur(22px);
      pointer-events: none;
    }
    .hint {
      min-height: 32px;
      margin: -2px auto 0;
      color: #a99b85;
      font-size: 12px;
      font-style: italic;
      line-height: 1.6;
      letter-spacing: .04em;
      transition: opacity .45s;
    }
    .action {
      position: relative;
      z-index: 9;
      min-width: 212px;
      margin-top: 17px;
      padding: 15px 27px 14px;
      border: 1px solid rgba(185,152,105,.65);
      background: rgba(24,21,19,.48);
      color: #e5d3b1;
      border-radius: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .3s, box-shadow .3s, transform .3s, opacity .4s;
      touch-action: manipulation;
    }
    .action:hover:not(:disabled) { background: rgba(116,89,56,.24); box-shadow: 0 0 30px rgba(169,125,75,.12); transform: translateY(-2px); }
    .action:disabled { opacity: .42; cursor: default; }
    .footer {
      position: relative; z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #736d62;
      padding: 14px 24px clamp(22px, 4vh, 38px);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      letter-spacing: .21em;
      text-transform: uppercase;
    }
    .footer::before, .footer::after { content: ''; width: 33px; height: 1px; background: rgba(190,155,101,.32); }
    .scene.is-open .book { transform: translateY(-50%) translateX(50%) rotate(0deg) scale(.92); }
    .scene.is-open .cover { transform: rotateY(-163deg); cursor: default; }
    .scene.is-open .artifact::before { opacity: 1; transform: translate(-50%, -50%) scale(1.55); }
    .scene.is-open h1 { opacity: .12; transform: translateY(-12px); }
    .scene.is-open .chapter { opacity: .28; }
    .scene.is-revealing .reveal-mist { animation: mist 3.3s ease-out forwards; }
    .scene.is-revealing .word span { animation: letterRise 1.8s cubic-bezier(.14,.72,.28,1) forwards; }
    .scene.is-revealing .word span:nth-child(1) { animation-delay: .05s; }
    .scene.is-revealing .word span:nth-child(2) { animation-delay: .23s; }
    .scene.is-revealing .word span:nth-child(3) { animation-delay: .4s; }
    .scene.is-revealing .word span:nth-child(4) { animation-delay: .57s; }
    .scene.is-complete .hint { color: #d3c1a2; font-style: normal; }
    @keyframes letterRise {
      0% { opacity: 0; filter: blur(28px); transform: translateY(128px) translateX(var(--from)) scale(.17) rotate(-18deg); }
      30% { opacity: .45; }
      68% { opacity: 1; filter: blur(5px); }
      100% { opacity: 1; filter: blur(0); transform: translateY(-35px) translateX(0) scale(1) rotate(0); }
    }
    @keyframes mist {
      0% { transform: translate(-50%, -50%) scale(.1); opacity: 0; }
      40% { opacity: .9; }
      100% { transform: translate(-50%, -90%) scale(2); opacity: 0; }
    }
    .screen-reader-only {
      position: absolute !important; height: 1px; width: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    @media (max-width: 640px) {
      :root { --book-w: clamp(176px, 53vw, 248px); }
      .topbar { font-size: 9px; letter-spacing: .15em; padding: 23px 22px 10px; }
      .topbar .serial { max-width: 130px; font-size: 8px; }
      .content { padding: 0 14px 14px; }
      .chapter { font-size: 9px; letter-spacing: .26em; }
      h1 { margin-top: 12px; font-size: clamp(24px, 6.5vw, 30px); min-height: auto; }
      .artifact { height: clamp(300px, 47svh, 410px); margin-top: 6px; }
      .cover-title { font-size: clamp(20px, 5vw, 26px); }
      .word { font-size: clamp(72px, 19vw, 104px); gap: 1px; letter-spacing: -.075em; }
      .word-stage { top: 41%; }
      .hint { font-size: 11px; max-width: 280px; }
      .action { padding: 14px 21px; margin-top: 17px; min-width: 200px; }
      .footer { padding: 16px 12px 19px; font-size: 8px; letter-spacing: .15em; }
      .scene.is-open .book { transform: translateY(-50%) translateX(50%) rotate(0deg) scale(.80); }
    }
    @media (max-height: 700px) {
      .topbar { padding-top: 15px; padding-bottom: 5px; }
      .content { justify-content: flex-start; padding-top: 9px; }
      .artifact { height: clamp(250px, 45svh, 350px); }
      h1 { font-size: clamp(21px, 3.2vw, 29px); }
      .footer { padding-top: 9px; padding-bottom: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .speck { animation: none; }
      .book, .cover, h1, .chapter, .hint, .artifact::before { transition-duration: .01ms !important; }
      .scene.is-revealing .word span { animation-duration: .01ms; }
      .scene.is-revealing .reveal-mist { animation: none; }
    }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="dust" id="dust" aria-hidden="true"></div>
    <header class="topbar">
      <div class="mark"><span class="cross">✳</span>PROSTRANSTVO</div>
      <div class="serial">ОХОТА ПО НЯЧАНГУ <span aria-hidden="true">/</span> 02</div>
    </header>
    <main class="content">
      <div class="chapter">ПОСЛАНИЕ ИЗ ЗАБЫТОГО АТЛАСА</div>
      <h1>Не каждую тайну<br>стоит будить.</h1>
      <div class="artifact">
        <div class="book" id="book">
          <div class="page-stack"></div>
          <div class="right-page" aria-hidden="true">
            <div class="page-top">TABULA UMBRARUM</div>
            <svg class="map-drawing" viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" fill="none">
              <g stroke="#614d36" stroke-width=".85" opacity=".85">
                <circle cx="119" cy="151" r="83"/><circle cx="119" cy="151" r="66"/><circle cx="119" cy="151" r="38"/>
                <path d="M119 30V273M8 151H231M49 80l140 142M189 80L49 222"/>
                <path d="M119 68L132 136L202 151L132 165L119 233L105 165L35 151L105 136Z"/>
                <path d="M24 54c64 18 95-14 171 0M29 248c60-26 110 22 173-2" stroke-dasharray="3 5"/>
                <path d="M56 124c25-24 32-42 62-35 19 5 33-4 53 11 15 11 0 24-13 34-22 19-31 42-20 58 14 22-5 33-29 17-20-13-32-6-49-26-13-15-1-29 4-40 4-9-20-9-8-19Z" opacity=".35"/>
              </g>
              <g fill="#614d36"><circle cx="119" cy="151" r="5"/><circle cx="119" cy="68" r="3"/><circle cx="202" cy="151" r="3"/><circle cx="35" cy="151" r="3"/><circle cx="119" cy="233" r="3"/></g>
              <g stroke="#614d36" stroke-width="1.1"><path d="M117 44h4m-2-2v4M14 151h9m-4-4v8M214 151h10m-5-5v10M117 255h4m-2-2v4"/></g>
            </svg>
            <div class="page-bottom">IV · MEMENTO</div>
            <div class="seam"></div>
          </div>
          <button type="button" class="cover" id="openAtlas" aria-label="Открыть Атлас теней">
            <div class="face front">
              <div class="cover-index">ARCHIVUM · II</div>
              <div class="cover-center">
                <svg class="sigil" viewBox="0 0 200 186" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none">
                  <g stroke="#b99a67" stroke-width=".9">
                    <circle cx="100" cy="91" r="74"/><circle cx="100" cy="91" r="62"/><circle cx="100" cy="91" r="47"/>
                    <circle cx="100" cy="91" r="10"/><path d="M100 8V174M17 91H183M40 31l120 120M160 31L40 151" opacity=".5"/>
                    <path d="M100 26L114 76L165 91L114 106L100 156L86 106L35 91L86 76Z"/>
                    <path d="M100 43l9 38 39 10-39 10-9 38-9-38-39-10 39-10Z" opacity=".65"/>
                    <path d="M100 3l3 8-3 8-3-8ZM100 163l3 8-3 8-3-8ZM7 91l8-3 8 3-8 3ZM177 91l8-3 8 3-8 3Z" fill="#b99a67" stroke="none"/>
                    <path d="M26 25l12 2-2 12M174 25l-12 2 2 12M26 159l12-2-2-12M174 159l-12-2 2-12" opacity=".6"/>
                  </g>
                  <circle cx="100" cy="91" r="3.7" fill="#e4c38d"/>
                </svg>
                <div class="cover-line"></div>
                <div class="cover-title">АТЛАС<br>ТЕНЕЙ</div>
              </div>
              <div class="cover-bottom">НЕ ОТКРЫВАТЬ</div>
            </div>
            <div class="face inside" aria-hidden="true">
              <svg class="inside-art" viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg" fill="none">
                <g stroke="#5c4630" stroke-width=".8">
                  <path d="M110 26L185 90L171 214L110 277L43 208L35 88Z"/>
                  <path d="M110 26l0 251M35 88l136 126M185 90L43 208M35 88l150 2M43 208l128 6"/>
                  <circle cx="110" cy="150" r="85"/><circle cx="110" cy="150" r="53"/><circle cx="110" cy="150" r="27"/>
                  <path d="M110 57l12 80 79 13-79 13-12 80-12-80-79-13 79-13Z"/>
                  <path d="M20 46H198M20 260H198" stroke-dasharray="2 4"/>
                </g>
                <g fill="#5c4630"><circle cx="110" cy="150" r="4"/><circle cx="110" cy="57" r="3"/><circle cx="110" cy="243" r="3"/></g>
              </svg>
              <div class="seam"></div>
            </div>
          </button>
        </div>
        <div class="word-stage" aria-hidden="true">
          <div class="reveal-mist"></div>
          <div class="word"><span style="--from:115px">Т</span><span style="--from:37px">Ь</span><span style="--from:-38px">М</span><span style="--from:-118px">А</span></div>
        </div>
      </div>
      <div class="hint" id="hint">Коснись обложки, если решишься.</div>
      <button class="action" id="action" type="button">Открыть атлас</button>
      <p id="announcement" class="screen-reader-only" role="status" aria-live="polite"></p>
    </main>
    <footer class="footer">АТЛАС ТЕНЕЙ · PROSTRANSTVO</footer>
  </div>
  <script>
    (function () {
      'use strict';
      var scene = document.getElementById('scene');
      var cover = document.getElementById('openAtlas');
      var action = document.getElementById('action');
      var hint = document.getElementById('hint');
      var announcement = document.getElementById('announcement');
      var dust = document.getElementById('dust');
      var timers = [];
      var state = 'closed';
      var seed = 12345;
      function random() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
      for (var i = 0; i < 55; i++) {
        var point = document.createElement('i');
        point.className = 'speck';
        point.style.left = (random() * 100) + '%';
        point.style.top = (random() * 100) + '%';
        point.style.setProperty('--o', (random() * .38 + .06).toFixed(2));
        point.style.setProperty('--t', (random() * 7 + 5).toFixed(1) + 's');
        point.style.setProperty('--d', (-random() * 12).toFixed(1) + 's');
        point.style.setProperty('--x', (random() * 40 - 20).toFixed(0) + 'px');
        dust.appendChild(point);
      }
      function later(fn, delay) { timers.push(window.setTimeout(fn, delay)); }
      function reset() {
        timers.forEach(window.clearTimeout);
        timers.length = 0;
        scene.classList.remove('is-open', 'is-revealing', 'is-complete');
        state = 'closed';
        action.disabled = false;
        cover.disabled = false;
        action.textContent = 'Открыть атлас';
        hint.textContent = 'Коснись обложки, если решишься.';
        announcement.textContent = '';
      }
      function open() {
        if (state === 'complete') { reset(); return; }
        if (state !== 'closed') return;
        state = 'opening';
        scene.classList.add('is-open');
        action.disabled = true;
        cover.disabled = true;
        action.textContent = 'Атлас пробуждается…';
        hint.textContent = 'Страницы помнят больше, чем кажется.';
        later(function () {
          scene.classList.add('is-revealing');
          announcement.textContent = 'Атлас раскрыт. Появляется слово ТЬМА.';
        }, 1050);
        later(function () {
          scene.classList.add('is-complete');
          state = 'complete';
          hint.textContent = 'Запомни это слово. Оно понадобится дальше.';
          action.textContent = 'Посмотреть еще раз';
          action.disabled = false;
        }, 3550);
      }
      cover.addEventListener('click', open);
      action.addEventListener('click', open);
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && state !== 'closed') reset();
      });
    })();
  </script>
</body>
</html>
